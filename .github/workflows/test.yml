name: Test NixOS Configurations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  discover-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Discover hosts
      id: set-hosts
      run: |
        # Find all directories in hosts/ and output as JSON array
        HOSTS=$(find hosts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "hosts=$HOSTS" >> $GITHUB_OUTPUT
        echo "Discovered hosts: $HOSTS"

  build:
    runs-on: ubuntu-latest
    needs: discover-hosts
    strategy:
      matrix:
        host: ${{ fromJson(needs.discover-hosts.outputs.hosts) }}
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract NixOS version
      id: version
      run: |
        # Extract stateVersion from config
        VERSION=$(grep -oP 'system\.stateVersion = "\K[0-9.]+' configuration-${{ matrix.host }}.nix)
        echo "nixos_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using NixOS version: $VERSION for ${{ matrix.host }}"

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}

    - name: Setup Home Manager channel
      run: |
        # Add home-manager to NIX_PATH for the build
        nix-channel --add https://github.com/nix-community/home-manager/archive/release-${{ steps.version.outputs.nixos_version }}.tar.gz home-manager
        nix-channel --update

    - name: Build ${{ matrix.host }} configuration
      run: |
        # Add home-manager to NIX_PATH and dry-run build to validate configuration
        export NIX_PATH="nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}:home-manager=$HOME/.nix-defexpr/channels/home-manager:$NIX_PATH"
        nix-build '<nixpkgs/nixos>' \
          -A system \
          -I nixos-config=./configuration-${{ matrix.host }}.nix \
          --dry-run

    - name: Check for syntax errors
      run: |
        # Add home-manager to NIX_PATH and parse the configuration to catch Nix syntax errors
        export NIX_PATH="nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}:home-manager=$HOME/.nix-defexpr/channels/home-manager:$NIX_PATH"
        nix-instantiate '<nixpkgs/nixos>' \
          -A system \
          -I nixos-config=./configuration-${{ matrix.host }}.nix \
          --show-trace

  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract NixOS version
      id: version
      run: |
        # Extract stateVersion from any config (they should all use the same version)
        VERSION=$(grep -oP 'system\.stateVersion = "\K[0-9.]+' configuration-T570.nix | head -1)
        echo "nixos_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using NixOS version: $VERSION"

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}

    - name: Check Nix formatting
      run: |
        # Check if files are formatted (don't fail, just report)
        echo "Checking Nix file formatting..."
        nix-shell -p nixfmt-rfc-style --run "nixfmt --check **/*.nix" || echo "Some files could be reformatted with nixfmt"
