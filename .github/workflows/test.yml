name: Test NixOS Configurations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract NixOS version
      id: version
      run: |
        # Extract stateVersion from config
        VERSION=$(grep -oP 'system\.stateVersion = "\K[0-9.]+' configuration-T570.nix)
        echo "nixos_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using NixOS version: $VERSION"

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}

    - name: Setup Home Manager channel
      run: |
        # Add home-manager to NIX_PATH for the build
        nix-channel --add https://github.com/nix-community/home-manager/archive/release-${{ steps.version.outputs.nixos_version }}.tar.gz home-manager
        nix-channel --update

    - name: Build T570 configuration
      run: |
        # Add home-manager to NIX_PATH and dry-run build to validate configuration
        export NIX_PATH="nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}:home-manager=$HOME/.nix-defexpr/channels/home-manager:$NIX_PATH"
        nix-build '<nixpkgs/nixos>' \
          -A system \
          -I nixos-config=./configuration-T570.nix \
          --dry-run

    - name: Check for syntax errors
      run: |
        # Add home-manager to NIX_PATH and parse the configuration to catch Nix syntax errors
        export NIX_PATH="nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}:home-manager=$HOME/.nix-defexpr/channels/home-manager:$NIX_PATH"
        nix-instantiate '<nixpkgs/nixos>' \
          -A system \
          -I nixos-config=./configuration-T570.nix \
          --show-trace

  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract NixOS version
      id: version
      run: |
        # Extract stateVersion from config
        VERSION=$(grep -oP 'system\.stateVersion = "\K[0-9.]+' configuration-T570.nix)
        echo "nixos_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using NixOS version: $VERSION"

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-${{ steps.version.outputs.nixos_version }}

    - name: Check Nix formatting
      run: |
        # Check if files are formatted (don't fail, just report)
        echo "Checking Nix file formatting..."
        nix-shell -p nixfmt-rfc-style --run "nixfmt --check **/*.nix" || echo "Some files could be reformatted with nixfmt"
